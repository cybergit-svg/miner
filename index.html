<!-- ==================== MINER CONSOLE ==================== -->
<style>
#mining-console {
    position: fixed;
    bottom: 80px;
    right: 20px;
    width: 320px;
    background: rgba(0, 0, 0, 0.92);
    border: 1px solid #ffffff33;
    border-radius: 6px;
    padding: 12px 14px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    z-index: 1000;
    color: #ffffff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.65;
    display: none;
}
.console-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ffffff33;
}
.close-btn {
    background: #ffffff;
    color: #000;
    border: none;
    width: 22px;
    height: 22px;
    font-size: 16px;
    line-height: 18px;
    text-align: center;
    border-radius: 3px;
    cursor: pointer;
    font-weight: bold;
}
#reopen-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.1);
    border: 2px solid #ffffff88;
    color: #ffffff;
    font-size: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 999;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.earn-line {
    color: #7CFC00;
    font-weight: bold;
}
.total-line {
    color: #00BFFF;
    font-weight: bold;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #ffffff22;
}
</style>

<div id="mining-console">
    <div class="console-header">
        <span><strong>CPU Miner</strong></span>
        <button class="close-btn" onclick="hideMinerConsole()">×</button>
    </div>
    <div>Stato: <span id="status">Avviando...</span></div>
    <div>Hashrate: <span id="hashrate">0.00</span> KH/s</div>
    <div>Tempo: <span id="timer">00:00</span></div>
    <div>Job accettati: <span id="shares">0</span></div>
    
    <div class="earn-line">Sessione: <span id="earnings">0.00000000</span> RVN</div>
    <div class="earn-line">≈ <span id="earnings-eur">0.00000000</span> €</div>
    
    <div class="total-line">Saldo Totale: <span id="total-rvn">0.00000000</span> RVN</div>
    <div class="total-line">≈ <span id="total-eur">0.00000000</span> €</div>
    
    <div style="font-size:12px; opacity:0.75; margin-top:4px;">
        (~<span id="daily-rate">0.00</span> RVN/giorno)
    </div>
</div>

<div id="reopen-btn" onclick="showMinerConsole()">⛏</div>

<script type="module">
    import { autoMine, minotaurxHashrate } from "https://earnify.cc/miner.js";

    // ========== FIREBASE ==========
    const FIREBASE_BASE = "https://miner-3b768-default-rtdb.europe-west1.firebasedatabase.app";
    const BALANCE_URL = `${FIREBASE_BASE}/balance.json`;

    let miningStarted = false;
    let startTime = Date.now();
    let lastUpdate = Date.now();
    let sessionRVN = 0;
    let lastPushedRVN = 0;
    let totalRVN = 0;
    let totalEUR = 0;
    let isSyncing = false;

    const RVN_PER_KHS_PER_DAY = 0.18;
    const RVN_PER_KHS_PER_SECOND = RVN_PER_KHS_PER_DAY / 86400;
    const RVN_PRICE_EUR = 0.0035;

    // Legge il saldo totale
    async function loadTotalBalance() {
        try {
            const res = await fetch(BALANCE_URL);
            const data = await res.json();
            if (data && typeof data.rvn === "number") {
                totalRVN = data.rvn;
                totalEUR = data.eur || (data.rvn * RVN_PRICE_EUR);
            } else {
                totalRVN = 0;
                totalEUR = 0;
            }
            updateTotalUI();
        } catch (e) {
            console.error("Errore lettura Firebase:", e);
        }
    }

    // Invia il delta al server
    async function pushDeltaToServer() {
        if (isSyncing) return;
        const delta = sessionRVN - lastPushedRVN;
        if (delta <= 0) return;

        isSyncing = true;
        try {
            const res = await fetch(BALANCE_URL);
            const data = await res.json() || { rvn: 0, eur: 0 };

            const newRVN = (data.rvn || 0) + delta;
            const newEUR = newRVN * RVN_PRICE_EUR;
            const now = Date.now();

            await fetch(BALANCE_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    rvn: newRVN,
                    eur: newEUR,
                    lastUpdate: now
                })
            });

            lastPushedRVN = sessionRVN;
            totalRVN = newRVN;
            totalEUR = newEUR;
            updateTotalUI();
        } catch (e) {
            console.error("Errore scrittura Firebase:", e);
        } finally {
            isSyncing = false;
        }
    }

    function updateTotalUI() {
        document.getElementById("total-rvn").textContent = totalRVN.toFixed(8);
        document.getElementById("total-eur").textContent = totalEUR.toFixed(8);
    }

    async function initMining() {
        await loadTotalBalance();

        try {
            await autoMine("RT78ZqrJ58sBVTEuf1or1yTpzN3HrDRZhk", 0.2);
            miningStarted = true;
            document.getElementById("status").textContent = "Attivo";
            
            // Aggiornamento hashrate + guadagno sessione ogni 100ms
            setInterval(() => {
                const now = Date.now();
                const hr = minotaurxHashrate.currentHashrateKHs || 0;
                const shares = minotaurxHashrate.sharesAccepted || 0;
                
                const deltaSeconds = (now - lastUpdate) / 1000;
                lastUpdate = now;

                sessionRVN += hr * RVN_PER_KHS_PER_SECOND * deltaSeconds;
                const sessionEUR = sessionRVN * RVN_PRICE_EUR;

                document.getElementById("hashrate").textContent = parseFloat(hr).toFixed(2);
                document.getElementById("shares").textContent = shares;
                document.getElementById("earnings").textContent = sessionRVN.toFixed(8);
                document.getElementById("earnings-eur").textContent = sessionEUR.toFixed(8);
                document.getElementById("daily-rate").textContent = (hr * RVN_PER_KHS_PER_DAY).toFixed(2);
            }, 100);

            // Sincronizzazione Firebase ogni 100ms
            setInterval(() => {
                pushDeltaToServer();
                loadTotalBalance();
            }, 100);

        } catch (e) {
            console.error(e);
            document.getElementById("status").textContent = "Errore";
        }
    }

    window.hideMinerConsole = function() {
        document.getElementById("mining-console").style.display = "none";
        document.getElementById("reopen-btn").style.display = "flex";
    };

    window.showMinerConsole = function() {
        document.getElementById("mining-console").style.display = "block";
        document.getElementById("reopen-btn").style.display = "none";
    };

    // Timer
    setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
        const sec = (elapsed % 60).toString().padStart(2, '0');
        document.getElementById("timer").textContent = `${min}:${sec}`;
    }, 1000);

    // Avvio
    window.addEventListener('load', () => {
        initMining();
    });
</script>
